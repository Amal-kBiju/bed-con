<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>

  <style>
    body {
      background-image: url("{{ url_for('static', filename='assets/bg.jpeg') }}");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo-container-left">
      <img src="{{ url_for('static', filename='assets/logo.png') }}"
           alt="Logo"
           class="logo-large"
           onclick="window.location.href='/'">
    </div>
    <ul>
      <li><a href="/about_page">About</a></li>
      <li><a href="/register_page">Register</a></li>
      <li><a href="/">Login</a></li>
    </ul>
  </nav>

  <!-- Page Content -->
  <div class="page-content">
    <div class="glass-container login-container">
      <h2>Login</h2>

      <form id="loginForm" method="POST" action="/login">
        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <!-- reCAPTCHA -->
        <div class="g-recaptcha" data-sitekey="6LeeANQrAAAAAHUaa3yyaDZj82UniF9D6sg2HgG5"></div>

        <button type="submit">Login</button>
      </form>

      <p>Don’t have an account? <a href="/register_page">Register</a></p>
    </div>
  </div>
<!-- ================= CHATBOT UI ================= -->
<div id="chatbot-button">💬</div>

<div id="chatbot-window">
  <div id="chatbot-header">AI Assistant</div>
  <div id="chatbot-messages"></div>
  <input
    id="chatbot-input"
    type="text"
    placeholder="Ask something..."
  />
</div>
<!-- ================================================= -->
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
